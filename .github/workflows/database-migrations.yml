name: Core Database Migration Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: core-db-migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chaotic_gaming_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chaotic_gaming_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chaotic_gaming_test
      STEAM_OPENID_RETURN_URL: https://www.chaoticmindsgaming.com/api/account/link/steam/callback
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Report dependency vulnerabilities
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const fs=require("node:fs"); const report=JSON.parse(fs.readFileSync("npm-audit.json","utf8")); console.log(JSON.stringify(report.vulnerabilities ?? {}, null, 2));'
      - name: Fail on high or critical dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Apply every SQL migration to a fresh PostgreSQL database
        run: npm run db:migrate
      - name: Build TypeScript API
        run: npm run build
      - name: Run API integration and plugin registry tests
        run: npm test
