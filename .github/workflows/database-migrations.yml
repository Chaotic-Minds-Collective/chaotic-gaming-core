name: Core Database Migration Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: core-db-migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chaotic_gaming_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chaotic_gaming_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chaotic_gaming_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Apply every SQL migration to a fresh PostgreSQL database
        run: npm run db:migrate
      - name: Build TypeScript API
        run: npm run build
      - name: Run plugin registry tests
        run: npm test
